name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  build:
    # Bun cross-compiles every platform from one Mac; the Mac is needed for
    # lipo (darwin-universal) and the ad hoc signatures. See
    # scripts/build-release.sh and package.json `build:<platform>`.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: The tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' package.json)
          [ "${tag#v}" = "$version" ] || { echo "tag $tag but package.json $version" >&2; exit 1; }
      - run: bun run typecheck
      - run: bun run laws
      - run: sh scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jev-fabric-dist
          path: |
            dist/jev-fabric-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  smoke:
    # Each archive runs on its own platform before anything is published.
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            archives: linux-x64
          - runner: ubuntu-22.04-arm
            archives: linux-arm64
          - runner: macos-latest
            archives: darwin-arm64 darwin-universal
          - runner: macos-15-intel
            archives: darwin-x64 darwin-universal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: jev-fabric-dist
          path: dist
      - name: Smoke test each archive
        run: |
          set -eux
          tag="${{ inputs.tag || github.ref_name }}"
          for platform in ${{ matrix.archives }}; do
            rm -rf "$RUNNER_TEMP/x" && mkdir -p "$RUNNER_TEMP/x"
            tar -xzf "dist/jev-fabric-$platform.tar.gz" -C "$RUNNER_TEMP/x"
            bin="$RUNNER_TEMP/x/jev-fabric/bin/jev-fabric"
            grep -q "^jev-fabric ${tag#v} for $platform" "$RUNNER_TEMP/x/jev-fabric/BUILD-PROVENANCE"
            sh scripts/smoke.sh "$bin" "$tag"
            case $platform in
              linux-*)
                # The newest glibc symbol the executable needs (Bun's: 2.17 today).
                newest=$(readelf -V "$bin" | grep -o "GLIBC_[0-9.]*" | sed "s/GLIBC_//" | sort -uV | tail -1)
                echo "newest glibc symbol: $newest"
                [ "$(printf "%s\n2.28\n" "$newest" | sort -V | tail -1)" = "2.28" ]
                ;;
              darwin-*) codesign --verify --strict "$bin" ;;
            esac
          done
      - name: install.sh picks this platform's archive
        run: |
          set -eux
          JEV_FABRIC_ARCHIVE_DIR="$PWD/dist" JEV_FABRIC_PREFIX="$RUNNER_TEMP/prefix" sh install.sh
          sh scripts/smoke.sh "$RUNNER_TEMP/prefix/bin/jev-fabric" "${{ inputs.tag || github.ref_name }}"

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: jev-fabric-dist
          path: dist
      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
              --title "jev-fabric $tag" --notes-file .github/release-notes.md --verify-tag
          fi

  npm:
    # Per-platform packages carry the executable (darwin-universal, linux-x64,
    # linux-arm64); `jev-fabric` carries the launcher, binaryPath(), the
    # clients and the TypeScript library for Bun. Publishing uses npm trusted
    # publishing: each package trusts this repo's release.yml, and npm trades
    # the job's OIDC token for a short-lived one, so no NPM_TOKEN secret exists.
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: jev-fabric-dist
          path: dist
      - run: node scripts/package-npm.mjs dist npm-out
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-out/*.tgz
          if-no-files-found: error
      - name: Publish to npm
        run: |
          set -eu
          # Platform packages first, so `jev-fabric` never points at a missing version.
          for pass in platform main; do
            # ./ keeps npm from reading npm-out/x.tgz as a GitHub user/repo shorthand.
            for tarball in ./npm-out/*.tgz; do
              spec=$(tar -xzOf "$tarball" package/package.json | node -p 'const p=JSON.parse(require("fs").readFileSync(0,"utf8")); p.name+"@"+p.version')
              case "$pass:${spec%@*}" in platform:jev-fabric|main:jev-fabric-*) continue ;; esac
              if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then echo "$spec already published"; continue; fi
              npm publish "$tarball" --access public --provenance
            done
          done
