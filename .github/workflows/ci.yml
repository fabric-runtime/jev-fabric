name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run laws
      - run: bun scripts/laws-doc.ts --check
      # Builds build/jev-fabric, then runs the black-box suite against it.
      - run: bun run test:conformance
      # Offline; python3 is preinstalled on both runners.
      - run: python3 clients/python/test_jev_fabric.py
        env:
          JEV_FABRIC_BIN: build/jev-fabric
      - run: sh scripts/smoke.sh build/jev-fabric

  release-build:
    # The release build as release.yml runs it: every platform cross-compiled
    # on one Mac, packaged, then installed from the archives by install.sh.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: sh scripts/build-release.sh
      - name: Install from the archives
        run: |
          set -eux
          JEV_FABRIC_ARCHIVE_DIR="$PWD/dist" JEV_FABRIC_PREFIX="$RUNNER_TEMP/prefix" sh install.sh
          sh scripts/smoke.sh "$RUNNER_TEMP/prefix/bin/jev-fabric"
          node scripts/package-npm.mjs dist "$RUNNER_TEMP/npm-out"

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in install.sh scripts/*.sh; do sh -n "$f"; done
